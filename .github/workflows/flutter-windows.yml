name: Windows build and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show Flutter toolchain
        run: flutter --version
      - name: Restore dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Build Windows release
        run: flutter build windows --release
      - name: Check release bundle
        shell: pwsh
        run: |
          $bundle = 'build/windows/x64/runner/Release'
          if (!(Test-Path $bundle)) { throw 'Flutter Windows release bundle was not produced.' }
          if (!(Test-Path "$bundle/NocUIExperience.exe")) { throw 'NocUIExperience.exe was not produced.' }
          if (!(Test-Path "$bundle/flutter_windows.dll")) { throw 'Flutter runtime is missing from the release bundle.' }
          if (!(Test-Path "$bundle/data/flutter_assets")) { throw 'Flutter assets are missing from the release bundle.' }
          'Flutter build and tests completed; Windows runtime, installation, and acceptance testing remain required.' >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: nocui-portable-x64
          path: flutter_app/build/windows/x64/runner/Release/
          if-no-files-found: error
      - name: Build Windows installer
        working-directory: .
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { throw 'Inno Setup 6 is not installed on this runner.' }
          & $compiler installer/NocUIFlutter.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'artifacts/flutter-installer/NocUI-Experience-Setup-x64.exe')) { throw 'Flutter installer was not produced.' }
          'The unsigned Flutter installer was compiled; installation and runtime have not been tested.' >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: nocui-experience-installer-x64
          path: artifacts/flutter-installer/NocUI-Experience-Setup-x64.exe
          if-no-files-found: error
